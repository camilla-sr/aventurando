<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aventura Interrompida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('/img/bg-floresta-escura.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #f8f9fa;
            font-family: 'Cinzel', serif;
            text-shadow: 1px 1px 3px #000;
        }

        .erro-container {
            background-color: rgba(0, 0, 0, 0.75);
            border-radius: 1rem;
            padding: 3rem;
            max-width: 600px;
            margin: 10% auto;
            text-align: center;
        }

        .erro-container h1 {
            font-size: 4rem;
            color: #dc3545;
        }

        .erro-container h2 {
            font-size: 2rem;
            margin-top: 1rem;
        }

        .btn-voltar {
            margin-top: 2rem;
            font-weight: bold;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');
    </style>
</head>
<body>
    <div class="erro-container shadow-lg">
        <h1>⚔️ Erro 404</h1>
        <h2>A trilha se perdeu na floresta...</h2>
        <p class="mt-3">O caminho que você tentou seguir não existe ou está inacessível.</p>
        <a href="/" class="btn btn-outline-light btn-voltar">Voltar à Taverna</a>
    </div>
</body>
</html>
